<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>UrbanInspect</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="text-align: center; margin-top: 20px; margin-bottom: 30px;">
    <h1 style="font-weight: bold; color: var(--ion-color-primary);">Bienvenido</h1>
    <p style="color: gray;">Sistema de Inspección Urbana</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-button expand="block" size="large" (click)="ir('/registro')" style="height: 80px; font-size: 1.2rem;">
          <ion-icon slot="start" name="add-circle-outline" size="large"></ion-icon>
          Registrar Incidencia
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <ion-button expand="block" size="large" color="secondary" (click)="ir('/listado')" style="height: 80px; font-size: 1.2rem;">
          <ion-icon slot="start" name="list-outline" size="large"></ion-icon>
          Ver Listado
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <ion-button expand="block" size="large" color="tertiary" (click)="ir('/seguimiento')" style="height: 80px; font-size: 1.2rem;">
          <ion-icon slot="start" name="bookmark-outline" size="large"></ion-icon>
          Mis Seguimientos
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
