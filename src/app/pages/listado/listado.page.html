<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Incidencias</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <!-- Listado de Tarjetas -->
  <ion-list>
    <ion-card *ngFor="let item of incidencias" (click)="verDetalle(item.id)" style="cursor: pointer;">
      <ion-card-header>
        <ion-card-title style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 1.1rem; font-weight: bold;">{{ item.tipo | titlecase }}</span>
          <ion-badge [color]="getColorEstado(item.estado)">{{ item.estado | uppercase }}</ion-badge>
        </ion-card-title>
      </ion-card-header>
      
      <ion-card-content style="font-size: 0.9rem;">
        <p><strong>Código:</strong> {{ item.id }}</p>
        <p><strong>Descripción:</strong> {{ item.descripcion }}</p>
        <p><strong>Dirección:</strong> {{ item.direccion }}</p>
        <p><strong>Sector:</strong> {{ item.sector }}</p>
        <p><strong>Fecha:</strong> {{ item.fecha }}</p>
        <p><strong>Prioridad:</strong> {{ item.prioridad | titlecase }}</p>
        
        <div *ngIf="item.fotografia" class="ion-text-center ion-padding-top">
          <img [src]="item.fotografia" alt="Evidencia" style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px;" />
        </div>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
